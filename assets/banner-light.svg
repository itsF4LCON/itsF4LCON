<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d3d1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#f5f1e8" stop-opacity="1"/><stop offset="0.55" stop-color="#f5f1e8" stop-opacity="0.6"/><stop offset="1" stop-color="#f5f1e8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="14" fill="#f5f1e8"/>
  <rect width="1200" height="280" rx="14" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="14" fill="none" stroke="#d6d3d1"/>
  <text x="56" y="70" font-size="18" fill="#5d574e"><tspan fill="#ef4444">~</tspan> $ whoami</text>
  <text x="52" y="160" font-size="92" font-weight="700" fill="#24211d" letter-spacing="-2">F4LCON<tspan fill="#ef4444" dx="10">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="56" y="210" font-size="22" fill="#5d574e">security tools &amp; things that run at the edge</text>
  <text x="56" y="244" font-size="16" fill="#a8a29e">Belgium  ·  xivlabs.tech</text>
  <g transform="translate(1000 64)">
    <circle cx="8" cy="0" r="12" fill="#ef4444" opacity="0.35"><animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="8" cy="0" r="6" fill="#ef4444"/>
    <text x="26" y="6" font-size="16" fill="#5d574e">hive: live</text>
  </g>
